<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Week 05 · 单摆简谐振动模拟器 · 欧阳雨彤 7902126140</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1a24;
    color: #e6e6f0;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  #stage { display: block; margin: 0 auto; }
  #hud {
    position: fixed; top: 16px; left: 20px;
    font-size: 13px; line-height: 1.7;
    color: #b8b8d0;
    background: rgba(20, 20, 30, 0.55);
    padding: 12px 16px;
    border: 1px solid rgba(120, 130, 200, 0.18);
    border-radius: 8px;
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  #hud b { color: #7fc8ff; font-weight: 600; }
  #hud h1 { margin: 0 0 8px; font-size: 15px; color: #e6e6f0; letter-spacing: 0.5px; }
  #panel {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: row; align-items: center; gap: 22px;
    background: rgba(20, 20, 30, 0.62);
    padding: 14px 22px;
    border: 1px solid rgba(120, 130, 200, 0.20);
    border-radius: 12px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }
  .ctrl { display: flex; flex-direction: column; gap: 4px; min-width: 175px; }
  .ctrl-label { font-size: 10px; color: #8a8aa8; letter-spacing: 1.5px; text-transform: uppercase; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; }
  #panel input[type=range] { width: 135px; accent-color: #7fc8ff; }
  #panel .val {
    color: #7fc8ff; font-variant-numeric: tabular-nums;
    min-width: 46px; text-align: right; font-size: 13px; font-weight: 600;
  }
  #panel .unit { font-size: 10px; color: #6a6a85; min-width: 24px; }
  #panel button {
    padding: 8px 14px; background: #2a2a3a; color: #e6e6f0;
    border: 1px solid #3a3a55; border-radius: 8px; cursor: pointer; font-size: 12px;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  #panel button:hover { background: #353550; }
  #panel button:active { transform: scale(0.97); }

  /* ---- 天体预设胶囊按钮 ---- */
  #presets {
    position: fixed; bottom: 112px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 10px;
    z-index: 10;
  }
  .preset {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(20, 20, 30, 0.62);
    color: #b8b8d0;
    border: 1px solid rgba(120, 130, 200, 0.25);
    font-size: 12px; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: blur(10px);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;   /* 消除触屏双击缩放延迟 */
    transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
  }
  .preset:hover { background: rgba(42, 42, 58, 0.85); color: #e6e6f0; }
  .preset .g-val {
    font-size: 10px; opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }
  .preset.active {
    background: rgba(127, 200, 255, 0.14);
    border-color: #7fc8ff;
    color: #7fc8ff;
    box-shadow: 0 0 14px rgba(127, 200, 255, 0.28);
  }
  #panel input[type=range] { touch-action: manipulation; }

  /* ---- 移动端 / 触屏设备适配（窄屏或粗指针） ---- */
  @media (max-width: 760px), (pointer: coarse) {
    #presets {
      bottom: 158px; gap: 8px;
      max-width: 96vw; flex-wrap: wrap; justify-content: center;
    }
    .preset { padding: 9px 14px; font-size: 13px; }
    #panel {
      flex-wrap: wrap; justify-content: center;
      gap: 10px 14px; bottom: 12px;
      width: min(94vw, 470px);
      padding: 12px 14px; box-sizing: border-box;
    }
    .ctrl { min-width: 124px; }
    #panel input[type=range] { width: 92px; }
    #panel button { padding: 10px 14px; font-size: 13px; }
    #hud {
      top: 8px; left: 8px; right: 8px;
      font-size: 11px; padding: 8px 10px; line-height: 1.6;
    }
    #hud h1 { font-size: 13px; }
    #foot { display: none; }
  }
  #foot {
    position: fixed; bottom: 158px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #5a5a78; letter-spacing: 1px;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hud">
    <h1>🎯 单摆简谐振动模拟器</h1>
    实验者：<b>欧阳雨彤</b>　·　学号：<b>7902126140</b><br>
    摆长 L = <b id="hudL">200</b> px　·　重力 g = <b id="hudG">9.8</b> m/s²（<b id="hudBody">地球</b>）<br>
    周期 T = <b id="hudT">—</b> s　·　角频率 ω = <b id="hudW">—</b> rad/s<br>
    当前摆角 θ = <b id="hudTheta">—</b>°　·　角速度 ω(t) = <b id="hudV">—</b> rad/s
  </div>

  <div id="presets">
    <button class="preset" data-body="earth"   data-g="9.8">🌍 地球<span class="g-val">9.8</span></button>
    <button class="preset" data-body="moon"    data-g="1.6">🌙 月球<span class="g-val">1.6</span></button>
    <button class="preset" data-body="jupiter" data-g="24.8">🪐 木星<span class="g-val">24.8</span></button>
    <button class="preset" data-body="space"   data-g="0.5">🚀 太空<span class="g-val">0.5</span></button>
  </div>

  <div id="panel">
    <div class="ctrl">
      <div class="ctrl-label">摆长 L</div>
      <div class="ctrl-row">
        <input type="range" id="rL" min="100" max="350" value="200">
        <span class="val" id="valL">200</span><span class="unit">px</span>
      </div>
    </div>
    <div class="ctrl">
      <div class="ctrl-label">重力 g</div>
      <div class="ctrl-row">
        <input type="range" id="rG" min="0.5" max="25" step="0.1" value="9.8">
        <span class="val" id="valG">9.8</span><span class="unit">m/s²</span>
      </div>
    </div>
    <div class="ctrl">
      <div class="ctrl-label">阻尼 γ</div>
      <div class="ctrl-row">
        <input type="range" id="rD" min="0" max="0.010" step="0.001" value="0">
        <span class="val" id="valD">0.000</span>
      </div>
    </div>
    <button id="btnReset">↻ 重置摆动 (45°)</button>
  </div>

  <div id="foot">南昌大学 · 食品科学与工程 · 7902126140 欧阳雨彤 · Week 05</div>

<script>
(() => {
  'use strict';

  // ============================================================
  //  Canvas 初始化（自适应窗口 + HiDPI 处理）
  // ============================================================
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = window.devicePixelRatio || 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ============================================================
  //  物理参数（与 HTML 控件绑定）
  // ============================================================
  const physics = {
    L: 200,    // 摆长 (px)
    g: 9.8,    // 重力加速度 (m/s², 显示用 — 角频率按 1/px 比例)
    theta0: 45 * Math.PI / 180,  // 初始角 (rad)
    damping: 0, // 阻尼系数（每秒钟衰减比例，0=无阻尼）
  };

  // ============================================================
  //  天体预设 & 数据持久化（localStorage，全程 try/catch 保证 0 报错）
  // ============================================================
  const PRESETS = { earth: '地球', moon: '月球', jupiter: '木星', space: '太空' };
  let currentPreset = 'earth';   // 当前天体场景（null = 用户自定义）

  const STORE_KEY = 'pendulum-sim-config-v1';
  // 探测当前环境是否可用 localStorage（file:// / 隐私模式可能被禁）
  const storageOK = (() => {
    try { const k = '__pendulum_probe__'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  })();

  function loadConfig() {
    if (!storageOK) return null;
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }
    catch (e) { return null; }   // 缓存损坏时不报错，静默用默认值
  }

  function saveConfig(gOverride) {
    if (!storageOK) return;
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        L: physics.L,
        g: (typeof gOverride === 'number' ? gOverride : physics.g),  // 过渡动画期间保存目标值
        damping: physics.damping,
        preset: currentPreset
      }));
    } catch (e) { /* 存储满/被禁用：静默降级，不影响模拟器运行 */ }
  }

  // 角频率 ω = sqrt(g / L)  —— 视觉上 1px ≈ 0.01m，使周期更接近真实
  const PX_PER_M = 100;  // 1m = 100px 的视觉比例
  const omega = () => Math.sqrt(physics.g * PX_PER_M / physics.L);

  // 状态
  let t = 0;        // 模拟时间 (s)
  let lastT = 0;    // 上一帧的 performance.now()
  let trail = [];   // 球的运动轨迹
  const MAX_TRAIL = 240;

  function resetSim() {
    t = 0;
    trail = [];
    lastT = performance.now();
  }

  // ============================================================
  //  物理计算：简谐振动 θ(t) = θ₀ · cos(ωt) · e^(-γt)
  //  （可选阻尼：e^(-damping·t) 衰减包络）
  // ============================================================
  function theta(t) {
    return physics.theta0 * Math.cos(omega() * t) * Math.exp(-physics.damping * t);
  }
  function thetaDot(t) {
    return -physics.theta0 * Math.sin(omega() * t) * Math.exp(-physics.damping * t) * omega()
         - physics.damping * physics.theta0 * Math.cos(omega() * t) * Math.exp(-physics.damping * t);
  }

  // ============================================================
  //  绘制：背景网格 + 摆杆 + 摆球（带光晕） + 轨迹
  // ============================================================
  const PIVOT_Y_FRAC = 0.18;  // 支点 Y 坐标占视口高度比例

  function drawGrid() {
    ctx.strokeStyle = 'rgba(120, 130, 200, 0.06)';
    ctx.lineWidth = 1;
    const step = 40;
    ctx.beginPath();
    for (let x = 0; x <= W; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function drawPivot(px, py) {
    // 支点：六边形金属感
    ctx.save();
    ctx.fillStyle = '#2a2a3a';
    ctx.strokeStyle = '#5a5a78';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3 + Math.PI / 6;
      const x = px + 10 * Math.cos(a);
      const y = py + 10 * Math.sin(a);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawRod(x1, y1, x2, y2) {
    const grad = ctx.createLinearGradient(x1, y1, x2, y2);
    grad.addColorStop(0, '#4a4a66');
    grad.addColorStop(0.5, '#8a8aa8');
    grad.addColorStop(1, '#4a4a66');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawBallWithGlow(x, y, r) {
    // 外层光晕（多层叠加产生柔和发光感）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 4; i >= 1; i--) {
      const radius = r + i * 8;
      const grad = ctx.createRadialGradient(x, y, r * 0.4, x, y, radius);
      grad.addColorStop(0, `rgba(127, 200, 255, ${0.18 - i * 0.03})`);
      grad.addColorStop(0.5, `rgba(127, 200, 255, ${0.10 - i * 0.02})`);
      grad.addColorStop(1, 'rgba(127, 200, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 球体本体
    const body = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    body.addColorStop(0, '#d8eaff');
    body.addColorStop(0.4, '#7fc8ff');
    body.addColorStop(1, '#2a5a8a');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // 高光
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath();
    ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    ctx.save();
    for (let i = 1; i < trail.length; i++) {
      const a = i / trail.length;
      ctx.strokeStyle = `rgba(127, 200, 255, ${a * 0.35})`;
      ctx.lineWidth = 1.5 * a;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawReferenceArc(px, py) {
    // 极淡的参考弧线（最大摆角范围）
    ctx.save();
    ctx.strokeStyle = 'rgba(127, 200, 255, 0.08)';
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py, physics.L, Math.PI / 2 - physics.theta0, Math.PI / 2 + physics.theta0);
    ctx.stroke();
    ctx.restore();
  }

  // ============================================================
  //  主循环
  // ============================================================
  // 暂停状态（空格键切换）— 在主循环顶部判断以避免双 rAF
  let paused = false;
  // 重力平滑过渡动画状态：{ from, to, start, dur }，null = 无动画进行中
  let gTween = null;

  function frame(now) {
    // 天体切换：重力平滑过渡（easeInOutCubic 缓动，900ms，暂停时也继续保证 UI 响应）
    if (gTween) {
      const p = Math.min(1, (now - gTween.start) / gTween.dur);
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      physics.g = gTween.from + (gTween.to - gTween.from) * e;
      syncGWidget();
      if (p >= 1) gTween = null;
    }

    if (paused) {
      // 暂停时只刷新渲染、不推进时间
      lastT = now;
    } else {
      const dt = Math.min((now - lastT) / 1000, 1 / 30);  // 限制最大步长（避免切到后台后大跳跃）
      lastT = now;
      t += dt;
    }

    // 1) 背景
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);
    drawGrid();

    // 2) 计算几何
    const px = W / 2;
    const py = H * PIVOT_Y_FRAC;
    const th = theta(t);
    const bx = px + physics.L * Math.sin(th);
    const by = py + physics.L * Math.cos(th);
    const ballR = Math.max(10, Math.min(22, physics.L * 0.08));

    // 3) 记录轨迹
    trail.push({ x: bx, y: by });
    if (trail.length > MAX_TRAIL) trail.shift();

    // 4) 绘制场景
    drawReferenceArc(px, py);
    drawTrail();
    drawRod(px, py, bx, by);
    drawPivot(px, py);
    drawBallWithGlow(bx, by, ballR);

    // 5) HUD 更新
    const T = 2 * Math.PI / omega();
    document.getElementById('hudT').textContent = T.toFixed(2);
    document.getElementById('hudW').textContent = omega().toFixed(2);
    document.getElementById('hudTheta').textContent = (th * 180 / Math.PI).toFixed(1);
    document.getElementById('hudV').textContent = thetaDot(t).toFixed(2);
    document.getElementById('hudL').textContent = physics.L.toFixed(0);
    document.getElementById('hudG').textContent = physics.g.toFixed(1);
    document.getElementById('hudBody').textContent = currentPreset ? PRESETS[currentPreset] : '自定义';

    requestAnimationFrame(frame);
  }
  resetSim();
  requestAnimationFrame(frame);

  // ============================================================
  //  UI 控件（滑块改动即保存；g 手动拖动会取消过渡并转为"自定义"）
  // ============================================================
  function bindRange(id, valId, key, fmt, onInput) {
    const r = document.getElementById(id);
    const v = document.getElementById(valId);
    r.addEventListener('input', () => {
      const num = parseFloat(r.value);
      physics[key] = num;
      v.textContent = fmt(num);
      if (typeof onInput === 'function') onInput(num);
    });
    return { slider: r, label: v };
  }
  const ctrlL = bindRange('rL', 'valL', 'L', v => v.toFixed(0), () => saveConfig());
  const ctrlG = bindRange('rG', 'valG', 'g', v => v.toFixed(1), () => {
    gTween = null;          // 手动拖动立即接管，取消进行中的过渡动画
    currentPreset = null;   // g 被手工修改 → 场景转为"自定义"
    markPreset();
    saveConfig();
  });
  const ctrlD = bindRange('rD', 'valD', 'damping', v => v.toFixed(3), () => saveConfig());

  // ---- 天体预设胶囊按钮：点击后重力平滑过渡 ----
  const PRESET_BUTTONS = Array.from(document.querySelectorAll('.preset'));
  function markPreset() {
    PRESET_BUTTONS.forEach(b => b.classList.toggle('active', b.dataset.body === currentPreset));
  }
  function syncGWidget() {
    ctrlG.slider.value = physics.g;
    ctrlG.label.textContent = physics.g.toFixed(1);
  }
  PRESET_BUTTONS.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = parseFloat(btn.dataset.g);
      currentPreset = btn.dataset.body;
      markPreset();
      // 从当前值平滑滑向目标重力（900ms 缓动）
      gTween = { from: physics.g, to: target, start: performance.now(), dur: 900 };
      saveConfig(target);   // 立即保存目标值（中途关页也能恢复到目的地）
    });
  });

  // ---- 数据持久化：页面加载时恢复上次保存的参数 ----
  (function restoreConfig() {
    const cfg = loadConfig();
    if (!cfg || typeof cfg !== 'object') { markPreset(); return; }
    // 边界收敛：防止缓存值越界导致 NaN / 异常物理
    const clamp = (v, lo, hi, dflt) =>
      (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, v)) : dflt;
    physics.L = clamp(cfg.L, 100, 350, physics.L);
    physics.g = clamp(cfg.g, 0.5, 25, physics.g);
    physics.damping = clamp(cfg.damping, 0, 0.010, physics.damping);
    ctrlL.slider.value = physics.L;   ctrlL.label.textContent = physics.L.toFixed(0);
    syncGWidget();
    ctrlD.slider.value = physics.damping; ctrlD.label.textContent = physics.damping.toFixed(3);
    currentPreset = (cfg.preset && PRESETS[cfg.preset]) ? cfg.preset : null;
    markPreset();
    console.log('💾 已恢复上次参数：L=' + physics.L.toFixed(0) + 'px · g=' + physics.g.toFixed(1) +
      'm/s² · γ=' + physics.damping.toFixed(3) +
      '（' + (currentPreset ? PRESETS[currentPreset] : '自定义') + '）');
  })();

  // "重置摆动"：精准回到 45° 初始状态（t 归零 + 轨迹清空 + theta0 重置）
  function resetSwing() {
    physics.theta0 = 45 * Math.PI / 180;
    t = 0;
    trail = [];
    lastT = performance.now();
  }
  document.getElementById('btnReset').addEventListener('click', resetSwing);

  // 空格键 = 暂停/继续（额外彩蛋）
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  });

  // ============================================================
  //  🛡️ 启动期自检：把"白屏"变成"控制台红字提示"
  //  防止 "onclick= 函数未定义" 这类作用域错误被静默吞掉
  // ============================================================
  (function selfCheck() {
    const required = [['#btnReset','重置'],['#rL','摆长'],['#rG','重力'],['#rD','阻尼'],['#stage','画布'],['#presets','天体预设栏'],['#hudG','HUD重力'],['#hudBody','HUD天体名']];
    const missing = required.filter(([s]) => !document.querySelector(s));
    if (missing.length) console.error('❌ 缺少 DOM:', missing);
    const presetCount = document.querySelectorAll('.preset').length;
    if (presetCount !== 4) console.error('❌ 天体预设按钮数量异常：' + presetCount + '（应为 4）');
    const fns = { frame: typeof frame, theta: typeof theta, resetSwing: typeof resetSwing, bindRange: typeof bindRange, markPreset: typeof markPreset, syncGWidget: typeof syncGWidget, saveConfig: typeof saveConfig, loadConfig: typeof loadConfig };
    const missFns = Object.entries(fns).filter(([,t]) => t !== 'function').map(([n]) => n);
    if (missFns.length) console.error('❌ 函数未定义:', missFns);
    if (!missing.length && !missFns.length && presetCount === 4) {
      console.log('✅ 自检通过 · 4 天体预设就绪 · 持久化' +
        (storageOK ? '已启用（localStorage，刷新后参数自动恢复）' : '不可用（当前浏览器环境限制，参数不做本地保存）'));
    }
  })();
})();
</script>
</body>
</html>
